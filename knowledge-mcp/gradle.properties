# This PC's global JAVA_HOME is C:\Program Files (x86)\Java\jdk1.8.0_202 (32-bit JDK 8).
# Left alone, two things break at once:
#   1) spring-boot-gradle-plugin 3.3.5 only publishes a Java 17 variant -> plugin resolution fails.
#   2) a 32-bit JVM cannot reserve a 2g heap -> the daemon does not even start.
# The line below runs the Gradle daemon on 64-bit JDK 17.
# NOTE: if IntelliJ has an explicit Gradle JVM configured, IntelliJ wins over this file
#       (Settings > Build, Execution, Deployment > Build Tools > Gradle > Gradle JVM).
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-17.0.20.101-hotspot

org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=false
