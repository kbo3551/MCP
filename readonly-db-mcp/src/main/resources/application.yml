spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: http
  application:
    name: readonly-db-mcp
  main:
    banner-mode: "off"
  ai:
    mcp:
      server:
        name: readonly-db-mcp
        version: 0.1.0
        type: SYNC
        annotation-scanner:
          enabled: true
  datasource:
    url: ${ORACLE_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${ORACLE_DB_USER}
    password: ${ORACLE_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      read-only: true
      maximum-pool-size: 3
      minimum-idle: 0
      auto-commit: false

db-mcp:
  allowed-owners: ${ORACLE_ALLOWED_OWNERS:APP}
  default-limit: 100
  max-limit: 500
  query-timeout-seconds: 30
